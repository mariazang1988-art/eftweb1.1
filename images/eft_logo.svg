<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="540" height="100">
  <defs>
    <!-- Gradient for Globe / Emblem -->
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="35%" stop-color="#22c55e" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- 3D Red Text Gradient matching e.f.t. logo.jpg -->
    <linearGradient id="red3d" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="25%" stop-color="#dc2626" />
      <stop offset="70%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Drop Shadow Filter for 3D Text -->
    <filter id="textShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="2" stdDeviation="1.5" flood-color="#450a0a" flood-opacity="0.45" />
    </filter>

    <filter id="emblemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#15803d" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left Emblem: Globe + Green Apple Contour + E.F.T. Ribbon -->
  <g transform="translate(10, 8)" filter="url(#emblemGlow)">
    <!-- Globe sphere -->
    <circle cx="42" cy="42" r="38" fill="url(#globeGrad)" />
    
    <!-- Longitude & Latitude grid lines -->
    <ellipse cx="42" cy="42" rx="38" ry="16" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.55" />
    <ellipse cx="42" cy="42" rx="38" ry="30" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.4" />
    <ellipse cx="42" cy="42" rx="16" ry="38" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.55" />
    <line x1="4" y1="42" x2="80" y2="42" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.75" />
    <line x1="42" y1="4" x2="42" y2="80" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.75" />

    <!-- Organic Green Leaf Swoosh on top -->
    <path d="M 42 6 C 54 -4 68 0 72 8 C 66 12 56 12 42 6 Z" fill="#16a34a" />
    <path d="M 42 6 C 36 -2 24 2 20 10 C 28 12 34 10 42 6 Z" fill="#22c55e" opacity="0.9" />

    <!-- Translucent Silver Ribbon across globe -->
    <path d="M 4 48 Q 42 30 80 50 Q 42 62 4 48 Z" fill="#ffffff" fill-opacity="0.92" stroke="#15803d" stroke-width="0.8" />
    
    <!-- "E.F.T." bold text inside ribbon -->
    <text x="42" y="52.5" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="14" fill="#15803d" letter-spacing="1">E . F . T .</text>
  </g>

  <!-- Right Typography: 3D Red Bold "HE Efficient and Industry Limited" -->
  <g transform="translate(108, 12)">
    <!-- 3D Shadow layer -->
    <text x="2" y="44" font-family="'Times New Roman', Georgia, serif" font-weight="bold" font-size="27" fill="#7f1d1d" opacity="0.6" letter-spacing="0.5">HE Efficient and Industry Limited</text>
    
    <!-- Primary 3D Embossed Text -->
    <text x="0" y="42" font-family="'Times New Roman', Georgia, serif" font-weight="bold" font-size="27" fill="url(#red3d)" filter="url(#textShadow)" letter-spacing="0.5">HE Efficient and Industry Limited</text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="66" font-family="Arial, sans-serif" font-weight="600" font-size="12" fill="#475569" letter-spacing="3.2">SHANGHAI · CALIFORNIA · HONG KONG</text>
    
    <!-- Thin Golden Accent Line -->
    <line x1="2" y1="73" x2="380" y2="73" stroke="#cbd5e1" stroke-width="1" />
  </g>
</svg>
